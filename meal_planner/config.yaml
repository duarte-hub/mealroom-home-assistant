name: Mealroom
version: "0.1.0"
slug: mealroom
url: https://github.com/duarte-hub/mealroom-home-assistant
description: Local meal planning, recipes and household shopping lists
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:food-apple-outline
panel_title: Mealroom
panel_admin: false
environment:
  INGRESS_ONLY: "true"
options:
  household: 2
  weekly_budget: 120
  shop: Coles
schema:
  household: int(1,12)
  weekly_budget: float(1,10000)
  shop: str
